<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>
    <h1>All Students</h1>
    <ul>
        {% for s in students %}
            <li>{{ s.Name }} - {{ s.age }} years old. Email : ({{ s.email }})</li>
        {% empty %}
            <li>No students found.</li>
        {% endfor %}
    </ul>
</body>
</html>
